<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NZ • Singapore • Sydney — Live Clock</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .clock{width:min(920px,94vw);padding:28px}
  .head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
  h1{font-size:clamp(22px,4vw,34px);margin:0}
  .live{font-size:13px;color:#86efac;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:24px 20px}
  .place{font-size:17px;font-weight:700;margin-bottom:8px}
  .zone{font-size:12px;color:#94a3b8;margin-bottom:18px}
  .time{font-variant-numeric:tabular-nums;font-size:clamp(30px,5vw,48px);font-weight:750;letter-spacing:-1px;white-space:nowrap}
  .date{font-size:13px;color:#cbd5e1;margin-top:10px}
  .tick{margin-top:18px;font-size:12px;color:#64748b;text-align:center}
  @media(max-width:680px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.clock{padding:20px}}
</style>
</head>
<body>
<main class="clock" aria-label="Live world clock">
  <div class="head">
    <h1>🌏 Team World Clock</h1>
    <div class="live" aria-live="polite">● LIVE • updates every second</div>
  </div>
  <section class="grid">
    <article class="card">
      <div class="place">🇳🇿 New Zealand</div>
      <div class="zone">Pacific/Auckland</div>
      <div class="time" id="nz">--:--:--</div>
      <div class="date" id="nz-date">Loading…</div>
    </article>
    <article class="card">
      <div class="place">🇸🇬 Singapore</div>
      <div class="zone">Asia/Singapore</div>
      <div class="time" id="sg">--:--:--</div>
      <div class="date" id="sg-date">Loading…</div>
    </article>
    <article class="card">
      <div class="place">🇦🇺 Sydney</div>
      <div class="zone">Australia/Sydney</div>
      <div class="time" id="syd">--:--:--</div>
      <div class="date" id="syd-date">Loading…</div>
    </article>
  </section>
  <div class="tick" id="tick">Times are calculated locally using IANA time zones.</div>
</main>
<script>
(() => {
  const clocks = [
    ["nz","nz-date","Pacific/Auckland"],
    ["sg","sg-date","Asia/Singapore"],
    ["syd","syd-date","Australia/Sydney"]
  ];
  const timeFmt = new Intl.DateTimeFormat("en-NZ", {
    timeZone:"UTC", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
  });
  function update(){
    const now = new Date();
    for (const [timeId,dateId,tz] of clocks) {
      const time = new Intl.DateTimeFormat("en-NZ", {
        timeZone:tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).format(now);
      const date = new Intl.DateTimeFormat("en-NZ", {
        timeZone:tz, weekday:"short", day:"2-digit", month:"short", year:"numeric"
      }).format(now);
      document.getElementById(timeId).textContent = time;
      document.getElementById(dateId).textContent = date;
    }
    document.getElementById("tick").textContent =
      "Last updated " + timeFmt.format(now) + " UTC • daylight saving handled automatically";
  }
  update();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
